name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PeptideLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PeptideLog-apk
          path: PeptideLog.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Peptide Log build ${{ github.run_number }}
          files: PeptideLog.apk
